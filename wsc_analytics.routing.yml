wsc_analytics.dashboard:
  path: '/admin/reports/wsc-analytics'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscDashboardController::renderDashboard'
    _title: 'WSC Analytics & Bot Shield'
  requirements:
    _permission: 'access wsc analytics reports'

wsc_analytics.settings:
  path: '/admin/config/services/wsc-analytics'
  defaults:
    _form: '\Drupal\wsc_analytics\Form\WscSettingsForm'
    _title: 'WSC Analytics Settings'
  requirements:
    _permission: 'administer wsc analytics'

wsc_analytics.llms_txt:
  path: '/llms.txt'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::serveLlmsTxt'
  requirements:
    _access: 'TRUE'
  methods: [GET, HEAD]

wsc_analytics.api_track:
  path: '/wsc/v1/track'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::track'
  requirements:
    _access: 'TRUE'
  methods: [POST]

wsc_analytics.api_webhook:
  path: '/wsc/v1/webhook'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::handleWebhook'
  requirements:
    _access: 'TRUE'
  methods: [POST]

wsc_analytics.ajax_refresh:
  path: '/wsc/v1/refresh'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscDashboardController::ajaxRefresh'
  requirements:
    _permission: 'access wsc analytics reports'
  methods: [POST]

wsc_analytics.api_cards:
  path: '/wsc/v1/cards'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::getCards'
  requirements:
    _permission: 'access wsc analytics reports'
  methods: [GET]

wsc_analytics.pagespeed_audit:
  path: '/wsc/v1/pagespeed/audit'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::triggerPagespeedAudit'
  requirements:
    _permission: 'access wsc analytics reports'
  methods: [POST]

wsc_analytics.sentinel_scan:
  path: '/wsc/v1/sentinel/scan'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::triggerSentinelScan'
  requirements:
    _permission: 'access wsc analytics reports'
  methods: [POST]

wsc_analytics.ai_coverage_query:
  path: '/wsc/v1/ai-coverage/query'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::aiCoverage'
  requirements:
    _permission: 'access wsc analytics reports'
  methods: [POST]

wsc_analytics.benchmarks_query:
  path: '/wsc/v1/benchmarks/query'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::getBenchmarks'
  requirements:
    _permission: 'access wsc analytics reports'
  methods: [GET, POST]

wsc_analytics.benchmarks_classify:
  path: '/wsc/v1/benchmarks/classify'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::classifyBenchmark'
  requirements:
    _permission: 'access wsc analytics reports'
  methods: [POST]

wsc_analytics.license_verify:
  path: '/wsc/v1/license/verify'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::verifyLicense'
  requirements:
    _permission: 'administer wsc analytics'
  methods: [POST]

wsc_analytics.license_disconnect:
  path: '/wsc/v1/license/disconnect'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::disconnectLicense'
  requirements:
    _permission: 'administer wsc analytics'
  methods: [POST]

wsc_analytics.cobranding_save:
  path: '/wsc/v1/cobranding/save'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::saveCoBranding'
  requirements:
    _permission: 'administer wsc analytics'
  methods: [POST]

wsc_analytics.indexnow_submit:
  path: '/wsc/v1/indexnow/submit'
  defaults:
    _controller: '\Drupal\wsc_analytics\Controller\WscApiController::submitIndexNow'
  requirements:
    _permission: 'administer wsc analytics'
  methods: [POST]
